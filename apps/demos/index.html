<!doctype html>
<html>
	<head>
		<meta charset="utf8" />
		<meta name="viewport" content="width=device-width" />
		<link
			rel="icon"
			type="image/x-icon"
			href="./src/common/icons/svelte-favicon.ico"
		/>
		<link
			rel="canonical"
			href="https://docs.svar.dev/svelte/editor/samples/"
		/>
		<title>SVAR Svelte Editor Component - Demos</title>
		<meta
			name="description"
			content="Explore all features of SVAR Svelte Editor. Try out the capabilities of editing data in a customizable form with backend synchronization. Links to the source code are provided."
		/>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
			}
			@font-face {
				font-family: "Roboto";
				font-style: normal;
				font-weight: 400;
				src:
					url("https://cdn.svar.dev/fonts/roboto/regular.woff2")
						format("woff2"),
					url("https://cdn.svar.dev/fonts/roboto/regular.woff")
						format("woff");
			}
			@font-face {
				font-family: "Roboto";
				font-style: normal;
				font-weight: 500;
				src:
					url("https://cdn.svar.dev/fonts/roboto/500.woff2")
						format("woff2"),
					url("https://cdn.svar.dev/fonts/roboto/500.woff")
						format("woff");
			}
		</style>

		<script type="module" src="./src/index.js"></script>
	</head>

	<body></body>
</html>
